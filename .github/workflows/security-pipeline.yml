
name: School ERP - Security Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: Build and Django validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp_ci
          POSTGRES_PASSWORD: ci_test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_ci -d erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: erp_test
      DB_USER: erp_ci
      DB_PASSWORD: ci_test_only_password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      EMAIL_HOST: localhost
      EMAIL_PORT: 2525
      EMAIL_USE_TLS: "False"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      DEFAULT_FROM_EMAIL: ci@example.invalid

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate temporary test keys
        run: |
          python - <<'PY'
          import os
          import secrets
          from cryptography.fernet import Fernet
          from django.core.management.utils import get_random_secret_key

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SECRET_KEY={get_random_secret_key()}\n")
              env.write(f"FIELD_ENCRYPTION_KEYS={Fernet.generate_key().decode()}\n")
              env.write(f"BLIND_INDEX_KEY={secrets.token_urlsafe(48)}\n")
          PY

      - name: Build Docker image
        run: |
          docker build -t school-erp-ci .

      - name: Django system check
        run: |
          docker run --rm \
            --network host \
            -e SECRET_KEY \
            -e FIELD_ENCRYPTION_KEYS \
            -e BLIND_INDEX_KEY \
            -e DB_NAME \
            -e DB_USER \
            -e DB_PASSWORD \
            -e DB_HOST \
            -e DB_PORT \
            -e DEBUG \
            -e ALLOWED_HOSTS \
            -e EMAIL_BACKEND \
            -e EMAIL_HOST \
            -e EMAIL_PORT \
            -e EMAIL_USE_TLS \
            -e EMAIL_HOST_USER \
            -e EMAIL_HOST_PASSWORD \
            -e DEFAULT_FROM_EMAIL \
            school-erp-ci \
            python manage.py check --database default

      - name: Apply database migrations
        run: |
          docker run --rm \
            --network host \
            -e SECRET_KEY \
            -e FIELD_ENCRYPTION_KEYS \
            -e BLIND_INDEX_KEY \
            -e DB_NAME \
            -e DB_USER \
            -e DB_PASSWORD \
            -e DB_HOST \
            -e DB_PORT \
            -e DEBUG \
            -e ALLOWED_HOSTS \
            -e EMAIL_BACKEND \
            -e EMAIL_HOST \
            -e EMAIL_PORT \
            -e EMAIL_USE_TLS \
            -e EMAIL_HOST_USER \
            -e EMAIL_HOST_PASSWORD \
            -e DEFAULT_FROM_EMAIL \
            school-erp-ci \
            python manage.py migrate --noinput

      - name: Start Django application
        run: |
          docker run -d \
            --name school-erp-app \
            --network host \
            -e SECRET_KEY \
            -e FIELD_ENCRYPTION_KEYS \
            -e BLIND_INDEX_KEY \
            -e DB_NAME \
            -e DB_USER \
            -e DB_PASSWORD \
            -e DB_HOST \
            -e DB_PORT \
            -e DEBUG \
            -e ALLOWED_HOSTS \
            -e EMAIL_BACKEND \
            -e EMAIL_HOST \
            -e EMAIL_PORT \
            -e EMAIL_USE_TLS \
            -e EMAIL_HOST_USER \
            -e EMAIL_HOST_PASSWORD \
            -e DEFAULT_FROM_EMAIL \
            school-erp-ci

      - name: Wait for Django
        run: |
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/; then
              echo "Django is responding."
              exit 0
            fi

            sleep 2
          done

          echo "Django did not start successfully."
          docker logs school-erp-app
          exit 1

      - name: Stop application
        if: always()
        run: |
          docker rm -f school-erp-app || true
