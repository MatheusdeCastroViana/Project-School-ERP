name: School ERP - Security Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: Build and Django validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp_ci
          POSTGRES_PASSWORD: ci_test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_ci -d erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t school-erp-ci .

      - name: Generate temporary test environment
        run: |
          docker run --rm school-erp-ci python -c "
          import secrets
          from cryptography.fernet import Fernet
          from django.core.management.utils import get_random_secret_key

          print('SECRET_KEY=' + get_random_secret_key())
          print('FIELD_ENCRYPTION_KEYS=' + Fernet.generate_key().decode())
          print('BLIND_INDEX_KEY=' + secrets.token_urlsafe(48))
          " > "$RUNNER_TEMP/generated_keys"

          {
            echo "DB_NAME=erp_test"
            echo "DB_USER=erp_ci"
            echo "DB_PASSWORD=ci_test_only_password"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DEBUG=True"
            echo "ALLOWED_HOSTS=localhost,127.0.0.1"
            echo "EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend"
            echo "EMAIL_HOST=localhost"
            echo "EMAIL_PORT=2525"
            echo "EMAIL_USE_TLS=False"
            echo "EMAIL_HOST_USER="
            echo "EMAIL_HOST_PASSWORD="
            echo "DEFAULT_FROM_EMAIL=ci@example.invalid"
            cat "$RUNNER_TEMP/generated_keys"
          } > "$RUNNER_TEMP/ci.env"

          chmod 600 "$RUNNER_TEMP/ci.env"
          rm "$RUNNER_TEMP/generated_keys"

      - name: Django system check
        run: |
          docker run --rm \
            --network host \
            --env-file "$RUNNER_TEMP/ci.env" \
            school-erp-ci \
            python manage.py check --database default

      - name: Apply database migrations
        run: |
          docker run --rm \
            --network host \
            --env-file "$RUNNER_TEMP/ci.env" \
            school-erp-ci \
            python manage.py migrate --noinput

      - name: Start Django application
        run: |
          docker run -d \
            --name school-erp-app \
            --network host \
            --env-file "$RUNNER_TEMP/ci.env" \
            school-erp-ci

      - name: Wait for Django
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -sS -o /dev/null \
              -w "%{http_code}" \
              http://127.0.0.1:8000/ || true)

            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
              echo "Django is responding."
              exit 0
            fi

            sleep 2
          done

          echo "Django did not start successfully."
          docker logs school-erp-app
          exit 1

      - name: Stop application
        if: always()
        run: |
          docker rm -f school-erp-app || true
          rm -f "$RUNNER_TEMP/ci.env"
