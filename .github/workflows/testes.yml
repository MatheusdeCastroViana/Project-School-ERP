name: School ERP - Unit Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Django unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DB_NAME: erp_test
      DB_USER: erp_ci
      DB_PASSWORD: ci_test_only_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp_ci
          POSTGRES_PASSWORD: ci_test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_ci -d erp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage

      - name: Generate temporary test keys
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import secrets
          from cryptography.fernet import Fernet
          from django.core.management.utils import get_random_secret_key

          print("SECRET_KEY=" + get_random_secret_key())
          print("FIELD_ENCRYPTION_KEYS=" + Fernet.generate_key().decode())
          print("BLIND_INDEX_KEY=" + secrets.token_urlsafe(48))
          PY

      - name: Run unit tests with coverage
        run: coverage run manage.py test --noinput

      - name: Coverage report
        if: always()
        run: |
          coverage report --omit="*/test*,*/migrations/*,manage.py"
          coverage report --format=markdown --omit="*/test*,*/migrations/*,manage.py" >> "$GITHUB_STEP_SUMMARY"
          coverage html --omit="*/test*,*/migrations/*,manage.py"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-erp-coverage-html
          path: htmlcov/
          if-no-files-found: warn
          retention-days: 14